apiVersion: 1

providers:
  - name: storage-demo
    orgId: 1
    folder: Storage Demo
    type: file
    # Editable in the browser, but changes live in the container and are lost on recreate: the
    # files in this directory are the ones that are kept.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
