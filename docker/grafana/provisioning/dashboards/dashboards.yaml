apiVersion: 1

providers:
  - name: storage-demo
    orgId: 1
    folder: Storage Demo
    type: file
    # Editable in the browser, because a dashboard is a thing people fiddle with while they are
    # looking for something. Changes live in the container and are lost on recreate; the files in
    # this directory are the ones that are kept, so a panel worth keeping is worth committing.
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
