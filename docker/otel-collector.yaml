# The one thing the API talks to. Everything else in the observability stack talks to this.
# The service exports OTLP and nothing else, which is what keeps a preview-quality Prometheus
# exporter and a second public port out of a media process.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Fewer, larger exports. At a thousand streams the API publishes a few hundred series per replica
  # and every one of them arrives on the same schedule, so batching is the difference between a
  # steady trickle and a spike per export interval.
  batch:
    timeout: 5s
    send_batch_size: 1024

  # A hard ceiling, because the collector shares a machine with the thing it is measuring.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

exporters:
  # Scraped by Prometheus, rather than the collector pushing: a pull model is what Prometheus is
  # built around, and it means a collector restart leaves a gap rather than a backlog.
  prometheus:
    endpoint: 0.0.0.0:8889
    # service.name and service.instance.id become labels, so a query can say "this replica" - which
    # is the same name the stream registry records as a stream's owner.
    resource_to_telemetry_conversion:
      enabled: true
    # Off, so a dotted metric name reaches Grafana as the same name with underscores and nothing
    # else; turning it on renames every series and the dashboards in docker/grafana/dashboards have
    # to be renamed with it.
    add_metric_suffixes: false

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo]
  telemetry:
    logs:
      level: warn
