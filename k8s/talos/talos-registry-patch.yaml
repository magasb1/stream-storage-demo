# Lets the nodes pull from the temporary in-cluster registry over plain HTTP.
# Talos has no Docker and no local image store, so an image built on a laptop can only reach it
# through a registry.
# Apply to every node, one at a time:
#   talosctl patch mc -e <node> -n <node> --patch @k8s/talos/talos-registry-patch.yaml
#
# Revert when finished, which is the whole of the change:
#   talosctl patch mc -e <node> -n <node> --patch '[{"op":"remove","path":"/machine/registries"}]'
#
# This is a configuration change only. It needs no reboot: Talos restarts the kubelet's image
# service in place.
machine:
  registries:
    mirrors:
      10.10.10.121:5000:
        endpoints:
          - http://10.10.10.121:5000
