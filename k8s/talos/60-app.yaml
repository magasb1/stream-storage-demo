# The application on this cluster: the generic Deployment in k8s/live/deployment.yaml with the three
# things that are specific to a bare-metal cluster with no cloud behind it.
#   image        pulled from the temporary registry in 00-registry.yaml, because Talos has no
#                local image store and nothing to build with
#   S3           keys from the ObjectBucketClaim rather than an assumed instance role
#   database     a connection string composed at start from the secret CloudNativePG generated
#
# Everything else is the same file. Kept whole rather than patched because a patch that silently
# stops matching its base is worse than a copy that plainly is one.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: storage-demo
  namespace: storage-demo
---
# Migrations run once, before any replica starts, so concurrent starts cannot race.
apiVersion: batch/v1
kind: Job
metadata:
  name: storage-demo-migrate
  namespace: storage-demo
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      serviceAccountName: storage-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: 10.10.10.121:5000/storage-demo:latest
          # The registry this names is temporary. Once every node has pulled the image it can be
          # deleted, and this is what lets the pods keep starting afterwards.
          imagePullPolicy: IfNotPresent
          args: ["--migrate-only"]
          envFrom:
            - configMapRef:
                name: storage-demo-config
            - configMapRef:
                name: storage-demo-talos
          env:
            - name: StorageMonitor__Enabled
              value: "false"
            - name: Live__Enabled
              value: "false"
            - name: Storage__S3__Bucket
              valueFrom:
                configMapKeyRef:
                  name: storage-demo-bucket
                  key: BUCKET_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: storage-demo-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-demo-bucket
                  key: AWS_SECRET_ACCESS_KEY
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: password
            # Kubernetes expands $(VAR) from env defined above it in the same container, so the
            # generated password is read from the operator's secret and written down nowhere.
            - name: Database__Postgres__ConnectionString
              value: Host=pg-rw;Database=storagedemo;Username=$(PG_USER);Password=$(PG_PASSWORD)
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-demo
  namespace: storage-demo
  # One replica per node, and that is a requirement here rather than a preference.
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      # Replace in place, one at a time. The spread below is mandatory, so there is nowhere for a
      # surge pod to go: a fourth pod would put two on some node and the scheduler would refuse it.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: storage-demo
  template:
    metadata:
      labels:
        app: storage-demo
    spec:
      serviceAccountName: storage-demo
      terminationGracePeriodSeconds: 60
      # Exactly one to a node, and DoNotSchedule because ScheduleAnyway is not good enough here: let
      # two replicas land on one node and some other node has none, and if that is the node Cilium
      # picked to answer for the address then nothing can reach the service at all.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: storage-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: 10.10.10.121:5000/storage-demo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: grpc
              containerPort: 5080
            - name: ingest
              containerPort: 9000
              protocol: UDP
            - name: consumption
              containerPort: 9010
              protocol: UDP
          envFrom:
            - configMapRef:
                name: storage-demo-config
            - configMapRef:
                name: storage-demo-talos
          env:
            - name: Storage__S3__Bucket
              valueFrom:
                configMapKeyRef:
                  name: storage-demo-bucket
                  key: BUCKET_NAME
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: storage-demo-bucket
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: storage-demo-bucket
                  key: AWS_SECRET_ACCESS_KEY
            - name: PG_USER
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: username
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pg-app
                  key: password
            - name: Database__Postgres__ConnectionString
              value: Host=pg-rw;Database=storagedemo;Username=$(PG_USER);Password=$(PG_PASSWORD)

            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: Live__NodeName
              value: $(POD_NAME)
            - name: Live__PeerBaseUrl
              value: http://$(POD_IP):8080
          lifecycle:
            preStop:
              sleep:
                seconds: 5
          startupProbe:
            # Liveness, not readiness: readiness asks Ceph and PostgreSQL whether they answer, and
            # on a cluster whose disks are slow that turns a slow dependency into an endless restart
            # loop.
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            # Ten seconds, so a replica that stops accepting leaves the Service quickly.
            timeoutSeconds: 4
            failureThreshold: 2
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 8Gi
---
# One address for everything, which is the whole point: somebody pointing an encoder or a player at
# this service has to know a single host, learn it once, and never revisit it.
# Four ports on it, two of them UDP. A Service carrying more than one protocol is allowed and has
# been since Kubernetes 1.26; the alternative is one address per protocol, which is exactly what
# this is avoiding.
apiVersion: v1
kind: Service
metadata:
  name: storage-demo
  namespace: storage-demo
  annotations:
    # Pinned. A client configured once keeps working, and the address outlives the Service.
    lbipam.cilium.io/ips: "10.10.10.122"
spec:
  type: LoadBalancer
  # Local, and here it is a correctness requirement rather than the diagnostic preference it is
  # elsewhere.
  # The cost is that Cilium announces this address over ARP only from a node that has a ready pod,
  # so while no pod is ready the address answers nothing at all.
  externalTrafficPolicy: Local
  selector:
    app: storage-demo
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 5080
      targetPort: grpc
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: ingest
      port: 9000
      targetPort: ingest
      protocol: UDP
    - name: consumption
      port: 9010
      targetPort: consumption
      protocol: UDP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: storage-demo
  namespace: storage-demo
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: storage-demo
