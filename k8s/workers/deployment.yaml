# The detection workers (detection-plan.md D2): a separate Deployment from the ingest pods.
#   kubectl apply -f k8s/ -f k8s/live/   # first
#   kubectl apply -f k8s/workers/        # then this
#
# A worker lists the streams, claims any whose detection toggle is set and which no worker holds,
# subscribes to each over the owner's peer route, decodes at the detection rate, and posts VMTI
# frames back to the owner.
# Nothing here is a Service. A worker answers no request; it makes them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: storage-demo-worker
  namespace: storage-demo
spec:
  # One, until a GPU exists. On a processor RF-DETR Nano takes about half a second a frame, so a
  # replica holds a handful of streams at one detection a second and no more.
  replicas: 1
  selector:
    matchLabels:
      app: storage-demo-worker
  template:
    metadata:
      labels:
        app: storage-demo-worker
    spec:
      serviceAccountName: storage-demo
      securityContext:
        runAsNonRoot: true
        runAsUser: 64198
        fsGroup: 64198
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: worker
          # docker build -f docker/Dockerfile --target worker -t storage-demo-worker .
          image: storage-demo-worker:latest
          env:
            # Where streams are listed: the API Service. Each stream's owner is then reached at the
            # pod address it recorded in its registry entry, not through the Service.
            - name: Worker__ApiBaseUrl
              value: http://storage-demo
            # The same token the API guards its live routes with; the peer routes a worker writes
            # through are guarded by it too.
            - name: Worker__Token
              valueFrom:
                secretKeyRef:
                  name: storage-demo-secrets
                  key: Live__Token
            # Names this worker in a stream's registry entry, so an operator can see who holds it.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: Worker__ModelPath
              value: /models/rf-detr-nano.onnx
            - name: Worker__ExecutionProvider
              value: auto
          # No GPU requested, on purpose: this is the processor path, which is also what a developer
          # machine runs.
          #   resources.limits: { nvidia.com/gpu: 1 }   # with the NVIDIA device plugin installed
          #   the image's base becomes an NVIDIA CUDA runtime image (docker/Dockerfile, "base")
          #   the runner logs "on the CUDA execution provider" instead of "using the processor"
          #
          # The CUDA publish carries that provider; selection and warm-up are probes at load time.
          # Two cores because inference runs one frame at a time and the demultiplexers and decoders
          # beside it want a core of their own; the memory is the model, the runtime and a few
          # streams' packet buffers.
          resources:
            requests:
              cpu: "2"
              memory: 2Gi
            limits:
              # Memory only, for the same reason as the API: a CPU limit throttles, and a throttled
              # worker does not detect more slowly, it drops frames.
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: models
              mountPath: /models
              readOnly: true
      volumes:
        # The model is not in the image: it is 108 MB and produced by scripts/fetch-rfdetr.sh.
        - name: models
          persistentVolumeClaim:
            claimName: storage-demo-models
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: storage-demo-models
  namespace: storage-demo
spec:
  accessModes: ["ReadOnlyMany"]
  resources:
    requests:
      storage: 1Gi
