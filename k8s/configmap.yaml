# Scenario D: real S3 plus PostgreSQL. Only configuration differs from the laptop scenario.
apiVersion: v1
kind: ConfigMap
metadata:
  name: storage-demo-config
  namespace: storage-demo
data:
  ASPNETCORE_ENVIRONMENT: Production

  Storage__Provider: S3
  Storage__S3__Bucket: storage-demo
  Storage__S3__Region: eu-north-1
  # ServiceUrl stays unset against real AWS; it exists for SeaweedFS and other S3-compatible stores.
  Storage__S3__ForcePathStyle: "false"

  Database__Provider: Postgres

  # The Deployment runs several replicas, so the change feed, the analysis queue and the scan lock
  # all have to be shared.
  Messaging__Provider: Redis
  Messaging__Redis__ConnectionString: redis:6379

  # Every replica polling the bucket is wasteful; one pass every two minutes is plenty.
  StorageMonitor__IntervalSeconds: "120"

  # Telemetry. The meters exist whether or not this is on - `dotnet-counters monitor -n
  # StorageDemo.Api --counters StorageDemo.Live` reads every one of them with no package and no
  # collector - so this decides export and nothing else.
  # Off here because the endpoint below is a guess about somebody else's cluster: it names the
  # OpenTelemetry Operator's default collector Service, and a cluster running Grafana Alloy, the
  # Datadog agent or a collector in another namespace wants a different address.
  Telemetry__Enabled: "false"
  OTEL_EXPORTER_OTLP_ENDPOINT: http://opentelemetry-collector.observability:4317

  # A tenth of the requests, against every one of them in Compose.
  Telemetry__TraceSampleRatio: "0.1"

  # Live streaming. Off here: k8s/live/deployment.yaml switches it on and exposes the two media
  # ports.
  Live__Enabled: "false"

  # Only manual streams name a transport, and only these are allowed.
  Live__AllowedSchemes: "udp,srt"

  # Thirty seconds of recent stream per replica-owned stream, bounded by a per-stream byte ceiling
  # so one careless encoder cannot evict the service.
  Live__BufferWindowSeconds: "30"
  Live__BufferByteCeiling: "100663296"

  # How long an interrupted stream is kept before it is considered gone: still claimed, still shown,
  # hub and buffer and any recording all still alive.
  Live__GracePeriodSeconds: "30"

  # Dead time between a camera connecting and its stream being on air, which after a reconnect is
  # what somebody watching experiences as downtime.
  Live__ProbeSeconds: "1"
  Live__ProbeBytes: "1048576"

  # How much of a recording is written to a pod's disk before it is stored and the file deleted.
  Live__RecordingPartMinutes: "5"

  # The ceiling on one recording, so a camera nobody stops still ends somewhere.
  Live__MaxRecordingMinutes: "720"

  # Retention. Off here, because nothing else in this service deletes a document by itself and
  # switching it on deletes somebody's recordings.
  # Only what live streaming produced is expired - recordings and snapshots - never an upload.
  Retention__Enabled: "false"
  Retention__MaxAgeDays: "0"
  Retention__IntervalSeconds: "3600"

  # How stale an owner's heartbeat may be before its registry entry is treated as abandoned.
  Retention__AbandonedEntryMinutes: "10"
---
apiVersion: v1
kind: Secret
metadata:
  name: storage-demo-secrets
  namespace: storage-demo
type: Opaque
stringData:
  # Replace before applying, or better, have an external secret operator populate this.
  Database__Postgres__ConnectionString: >-
    Host=postgres;Database=storagedemo;Username=storagedemo;Password=CHANGE_ME;SSL Mode=Require;Trust Server Certificate=true
