# The failover rig: one producer pushing a named stream, one viewer pulling it back, both reporting
# a timestamped frame counter.
#   kubectl apply -f k8s/live/failover-test.yaml
#   kubectl -n storage-demo logs -f deploy/srt-viewer
#
# Which pod owns the stream is in the registry, and any replica will tell you:
#   kubectl -n storage-demo exec deploy/srt-producer -- \
#     wget -qO- --header='X-Storage-Token: local-demo-token' http://storage-demo:80/api/live
#
# Then delete that pod and read the gap between two consecutive frame lines in each log.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srt-producer
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srt-producer
  template:
    metadata:
      labels:
        app: srt-producer
    spec:
      containers:
        - name: producer
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache ffmpeg >/dev/null
              # Nothing is requested first. The encoder connects, names itself, and reconnects on
              # its own, which is what a real contribution encoder does and what the design counts
              # on: a pod disappearing is absorbed by the sender retrying.
              while true; do
                echo "$(date -u +%T) connecting"
                ffmpeg -hide_banner -loglevel warning -re \
                  -f lavfi -i "testsrc=size=640x360:rate=25" \
                  -c:v mpeg2video -b:v 1200k -g 25 \
                  -f mpegts "srt://storage-demo-ingest:9000?mode=caller&streamid=%23!::r=failover-demo,m=publish" \
                  -progress pipe:1 -stats_period 1 2>&1 |
                  while read -r line; do
                    case "$line" in frame=*) echo "$(date -u +%T) $line" ;; esac
                  done
                echo "$(date -u +%T) sender stopped"
                sleep 1
              done
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: srt-viewer
  namespace: storage-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: srt-viewer
  template:
    metadata:
      labels:
        app: srt-viewer
    spec:
      containers:
        - name: viewer
          image: alpine:3.20
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache ffmpeg >/dev/null
              # A bare name rather than the convention's envelope: that starts with '#', which has
              # to be written %23 in a URL, and FFmpeg versions disagree about when they decode it.
              # The probe limits matter as much as anything the server does.
              # Decodes and discards, reporting a timestamped frame counter once a second.
              while true; do
                echo "$(date -u +%T) connecting"
                ffmpeg -hide_banner -loglevel warning \
                  -analyzeduration 1000000 -probesize 1000000 -fflags nobuffer \
                  -i "srt://storage-demo-consumption:9010?mode=caller&streamid=failover-demo" \
                  -f null - -progress pipe:1 -stats_period 1 2>&1 |
                  while read -r line; do
                    case "$line" in frame=*) echo "$(date -u +%T) $line" ;; esac
                  done
                echo "$(date -u +%T) viewer disconnected"
                sleep 1
              done
          resources:
            requests:
              cpu: 200m
              memory: 128Mi
